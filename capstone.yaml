run: uvicorn app.main:app --reload
seed: alembic upgrade head && python seed.py
test: pytest -q
test_result: 86 passed
base_url: http://localhost:8000
endpoints:
  - method: POST
    path: /tenants
  - method: POST
    path: /generate
  - method: GET
    path: /usage/{tenant_id}
  - method: GET
    path: /checkout/{tenant_id}
  - method: POST
    path: /webhooks/stripe
  - method: GET
    path: /health
