# Flyrank capstone project manifest
# Describes the actual state of this repository. Paths are relative to the
# repository root.

name: Billing Engine
slug: billing-engine
summary: >-
  Multi-tenant usage metering and billing engine for an AI SaaS product. Records
  one usage event per billable request, enforces per-plan monthly quota, and
  supports exactly-once accounting via client-supplied idempotency keys.
stage: 3
stage_name: Stripe integration
status: complete

runtime:
  language: python
  min_version: "3.11"
  package_manager: pip
  entrypoint: app.main:app
  serve: uvicorn app.main:app --reload
  framework: fastapi
  database: sqlite
  migrations: none
  migration_note: >-
    Alembic is present in requirements.txt but unused. Tables are created by
    SQLAlchemy create_all during FastAPI lifespan startup.

initialization:
  # Must be run once before the first request; POST /tenants requires the Free
  # plan to exist.
  commands:
    - pip install -r requirements.txt
    - cp .env.example .env      # cp on macOS/Linux, copy on Windows
    - python seed.py
    - uvicorn app.main:app --reload
  seed_script: seed.py
  seed_idempotent: true
  creates_tables: true
  creates_plans: [Free, Pro]
  creates_test_tenant: true
  test_tenant_email: test@example.com

implemented:
  - id: tenant-creation
    description: >-
      POST /tenants creates a tenant on the Free plan together with an active
      Free subscription in the same transaction, so the returned tenant can
      generate immediately.
    status: implemented
    file: app/routes/tenants.py

  - id: generate
    description: >-
      POST /generate meters one billable request. Requires X-Idempotency-Key
      (400 if absent, never server-generated). Checks subscription (402) then
      monthly quota (429) before inserting exactly one usage_events row. A
      repeated key replays the stored status and body byte-for-byte.
    status: implemented
    file: app/routes/generate.py
    guarantees:
      - one usage row per successful billable request
      - rejected requests write no row and consume neither quota nor key
      - quota boundary inclusive at the limit
    services:
      - app/services/usage_service.py
      - app/services/quota.py

  - id: usage-rollup
    description: >-
      GET /usage/{tenant_id} returns current UTC calendar-month usage against
      plan limits. Half-open window [month_start, month_end). No pricing.
    status: implemented
    file: app/routes/usage.py

  - id: tests
    description: pytest suite, per-test throwaway SQLite database.
    status: implemented
    file: tests/test_stage_b.py
    command: pytest -q
    expected: 50 passed

implemented:
  - id: stripe-checkout
    description: GET /checkout/{tenant_id} — Stripe Checkout session creation.
    status: implemented
    design_ref: DESIGN.md
    required_env: [STRIPE_SECRET_KEY]

  - id: stripe-webhook
    description: >-
      POST /webhooks/stripe — raw-body receiver with signature verification and
      event deduplication on stripe_events.stripe_event_id.
    status: implemented
    design_ref: DESIGN.md
    required_env: [STRIPE_WEBHOOK_SECRET]

  - id: stripe-subscription-lifecycle
    description: Handling of subscription.updated and subscription.deleted.
    status: implemented
    design_ref: DESIGN.md

not_implemented:

  - id: pricing
    description: >-
      Cost calculation per request. price_cents exists on plans; no cost is
      computed or stored per request. All money is integer cents.
    status: design_only
    design_ref: DESIGN.md

  - id: migrations
    description: Alembic migration history.
    status: not_started

remaining: >-
  Stage 4: pricing and cost calculation. See BUILDLOG.md.

data_model:
  tables:
    - name: plans
      id_column: id
      seed_rows: 2
      columns: [id, name, api_calls_limit, tokens_limit, price_cents, created_at]
    - name: tenants
      id_column: id
      columns: [id, name, email, stripe_customer_id, plan_id, status, created_at]
      unique_constraints: [email, stripe_customer_id]
    - name: subscriptions
      id_column: id
      columns: [id, tenant_id, plan_id, stripe_subscription_id, status,
                current_period_start, current_period_end, created_at]
      unique_constraints: [tenant_id, stripe_subscription_id]
    - name: usage_events
      id_column: id
      columns: [id, tenant_id, api_calls, input_tokens, cached_input_tokens,
                output_tokens, reasoning_tokens, idempotency_key, response_body,
                response_status_code, created_at]
      unique_constraints: [idempotency_key]
      note: >-
        One row per request. No cost column at this stage. response_status_code
        exists so a replay can return the original status as well as body.
    - name: stripe_events
      id_column: id
      columns: [id, stripe_event_id, event_type, payload, processed, processed_at, created_at]
      unique_constraints: [stripe_event_id]
      note: Verified events are claimed and marked processed atomically with local state.

design_decisions:
  - id: one-row-per-request
    summary: >-
      One usage_events row per request rather than a type+quantity ledger, so a
      single idempotency key maps to exactly one row via one UNIQUE constraint.
  - id: quota-before-insert
    summary: >-
      Quota is checked before the insert. The reverse order would leave an
      orphan row consuming quota and would burn the client's retry key.
  - id: header-idempotency
    summary: >-
      Idempotency key comes only from X-Idempotency-Key. The server never
      synthesises one, because a generated key cannot make a retry idempotent.
  - id: naive-utc
    summary: >-
      All timestamps are naive UTC. SQLite drops tzinfo on read, so storing aware
      datetimes would silently break calendar-month range queries.
  - id: integer-cents
    summary: All money is integer cents. No floats anywhere.
  - id: sorted-serialization
    summary: >-
      Responses are serialised with sort_keys=True on both the first delivery
      and every replay, so the bytes match.

concurrency:
  idempotency: >-
    The UNIQUE constraint on usage_events.idempotency_key is the authority. The
    pre-insert lookup is a fast path only. IntegrityError is caught, the session
    rolled back, and the winning row replayed.
  quota: >-
    Check-quota-then-insert runs under a process-wide lock in usage_service.py.
  known_limitation: >-
    The quota lock is per-process. A multi-worker deployment needs a real
    database lock (SELECT ... FOR UPDATE, or BEGIN IMMEDIATE on SQLite).

environment:
  required: [STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PRO_PRICE_ID, APP_BASE_URL]
  optional: [DATABASE_URL]
  defaults:
    DATABASE_URL: sqlite:///./billing.db
    APP_BASE_URL: http://localhost:8000
  note: >-
    Stripe placeholders in .env.example are safe. Automated tests mock Stripe
    API calls and do not require real credentials.

documents:
  README.md: Project overview, setup, run, and API reference.
  DESIGN.md: Schema, rationale, API contract, ordering and concurrency guarantees.
  EVIDENCE.md: Raw Stage 2 probe output and test results.
  BUILDLOG.md: Development progression by commit.

tags:
  stage-b-done: >-
    Stage 2 complete. Points to commit bdd9322.
  stage-b-runnable: >-
    Fresh clone is runnable (seed.py and setup docs added).
