[pytest]
# Test discovery lives in tests/.
testpaths = tests
python_files = test_*.py

# Note: basetemp is intentionally not set here. The suite does not use the
# tmp_path fixture, because this machine's default pytest base temp directory
# is access-denied and any test requesting tmp_path would error at setup.
# tests/conftest.py allocates its own writable per-test directory instead.
